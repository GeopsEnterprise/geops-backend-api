# Spring Application Name
spring.application.name=geops-api

# Port (Render/Railway/Koyeb inject PORT)
server.port=${PORT:8080}

# Frontend URL used for CORS (development default)
frontend.url=https://geops-app-web.vercel.app
prod.frontend.url=${PROD_FRONTEND_URL:}


# Spring DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/geops?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# HikariCP: recycle connections before MySQL/Railway closes them
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=3000

# Actuator: expose only health (used by Railway healthcheck)
management.endpoints.web.exposure.include=health

# Spring Data JPA Configuration
spring.jpa.show-sql=true
# Force MySQL dialect so Hibernate doesn't need to autodetect it at startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=com.geopslabs.geops.api.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Elements take their values form maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

server.max-http-request-header-size=128KB

# Security Configuration
authorization.jwt.secret=${JWT_SECRET:mi_clave_local_larga_1234567890_extra}
authorization.jwt.expiration.days=7